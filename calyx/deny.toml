# cargo-deny policy for the standalone Calyx workspace.
#
# Synapse and Calyx intentionally resolve different capability graphs: Synapse
# disables neural execution modules it does not use, while standalone Calyx
# keeps those modules default-on. Keeping the policies beside their lock files
# lets unused advisory exceptions remain fail-closed in both graphs.

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "x86_64-pc-windows-msvc" },
]

[advisories]
version = 2
unsound = "all"
unmaintained = "all"
yanked = "deny"

# `paste` is a compile-time proc macro reached by standalone Calyx's default-on
# Candle/tokenizers model stack. It has no fixed release; this exception must be
# removed when that upstream stack drops it. Stale exceptions fail this gate.
ignore = [
    { id = "RUSTSEC-2024-0436", reason = """
paste 1.0.15 is unmaintained and has no fixed version. In the standalone Calyx
graph it is compile-time-only through gemm/pulp and macro_rules_attribute in the
default-on Candle/tokenizers model stack; it has no runtime component.

Removal condition: delete this exception when the default-on model stack drops
paste. `unused-ignored-advisory = "deny"` makes that condition fail closed.
""" },
]
unused-ignored-advisory = "deny"

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "MPL-2.0",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
]

[[licenses.clarify]]
name = "unescaper"
expression = "MIT"
license-files = [{ path = "LICENSE-MIT", hash = 0xeb164a42 }]

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
