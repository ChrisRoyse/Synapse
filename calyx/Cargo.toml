[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
repository = "https://github.com/ChrisRoyse/Calyx"
# calyx/LICENSE is Business Source License 1.1 — a DIFFERENT licence from the
# repository root's PolyForm-Noncommercial-1.0.0 (LICENSE.md). Without this,
# `cargo deny check licenses` reported all 15 calyx crates as literally
# "unlicensed", which was true of the manifests and false of the tree. (#1930)
license-file = "LICENSE"
publish = false

[workspace.dependencies]
# First-party calyx crates. Declared here so the version requirement on an
# internal path dependency lives in exactly ONE place; a bare `{ path = ... }`
# is a `*` requirement, which `deny.toml` bans (#1930).
calyx-anneal = { version = "0.1.0", path = "crates/calyx-anneal" }
calyx-assay = { version = "0.1.0", path = "crates/calyx-assay" }
calyx-aster = { version = "0.1.0", path = "crates/calyx-aster" }
calyx-core = { version = "0.1.0", path = "crates/calyx-core" }
calyx-forge = { version = "0.1.0", path = "crates/calyx-forge" }
calyx-ledger = { version = "0.1.0", path = "crates/calyx-ledger" }
calyx-lodestar = { version = "0.1.0", path = "crates/calyx-lodestar" }
calyx-loom = { version = "0.1.0", path = "crates/calyx-loom" }
calyx-mincut = { version = "0.1.0", path = "crates/calyx-mincut" }
calyx-paths = { version = "0.1.0", path = "crates/calyx-paths" }
calyx-registry = { version = "0.1.0", path = "crates/calyx-registry", default-features = false }
calyx-sextant = { version = "0.1.0", path = "crates/calyx-sextant" }
calyx-ward = { version = "0.1.0", path = "crates/calyx-ward", default-features = false }

aes-gcm = "0.10"
blake3 = "1"
bincode = { package = "bincode_reloaded", version = "3.1.6", features = ["serde"] }
ciborium = "0.2"
crc32fast = "1"
cudarc = { version = "0.19.8", default-features = false }
cuvs-sys = "26.6.0"
ed25519-dalek = "2"
filetime = "0.2"
hkdf = "0.12"
# >= 0.9.11: RUSTSEC-2026-0186 (unchecked pointer offset). Held as a floor in the
# manifest so a fresh resolve cannot go back below it.
memmap2 = "0.9.11"
nix = { version = "0.30", default-features = false, features = ["fs"] }
prometheus = { version = "0.14", default-features = false }
rand = "0.9"
rand_chacha = "0.9"
rayon = "1"
nvml-wrapper = "0.10"
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
signal-hook = "0.4"
thiserror = "2"
tokio = "1"
tokio-util = "0.7"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"
tungstenite = { version = "0.29.0", features = ["rustls-tls-webpki-roots"] }
ulid = { version = "1", features = ["serde"] }
ureq = { version = "3.3.0", features = ["json"] }
uuid = { version = "1", features = ["serde"] }
wide = "1"
zeroize = "1"
zstd = "0.13"

# ── Build profiles ───────────────────────────────────────────────────────────
# Tuned for this workspace's high-churn, multi-agent build cadence. The cargo
# default (`debug = 2`, full DWARF) made generated executables ~280 MB and
# ballooned the shared target/ dir to ~190 GB within days. `line-tables-only`
# keeps function names + file:line in panic backtraces - everything the
# structural gate (`cargo check`) needs - while cutting executable
# size and link time several-fold. First-party crates keep line tables;
# dependencies get no debuginfo at all since we never step into them.
#
# Portable and machine-agnostic: these apply identically wherever the workspace
# builds, so they live here instead of a machine-local Cargo config. Linker
# choice and incremental policy remain local build-host concerns.
[profile.dev]
debug = "line-tables-only"

# Dependencies are compiled once and never stepped into during this project's
# structural-check workflow; stripping their debuginfo is the single biggest target/
# size reduction with zero loss of first-party debuggability.
[profile.dev.package."*"]
debug = false

# The absorbed Calyx crates are Synapse-owned code, but this remains a nested
# workspace so it can keep a policy that fits the imported baseline. Deny the
# stable clippy correctness/style surface for every member and leave stricter
# Synapse-wide pedantic/nursery escalation to targeted follow-up work.
[workspace.lints.clippy]
all = "deny"
