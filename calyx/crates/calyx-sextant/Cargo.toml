[package]
autotests = false
name = "calyx-sextant"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
# `cuda` is the whole GPU surface for this crate (#1130). The cuVS deps are
# target-gated to Linux because RAPIDS ships no native Windows/macOS libcuvs
# (#1016): on non-Linux targets `--features cuda` still builds, the cuVS index
# paths are compiled out (`cfg(sextant_cuvs)`, emitted by build.rs), and the
# runtime stubs fail closed naming the platform limitation. The resolved truth
# is exported as `CUVS_COMPILED` for build-info capability readback — deploy
# gates must assert that, never the feature name.
cuda = ["dep:cudarc", "dep:cuvs-sys"]
# `forge-gpu` turns on calyx-forge's CUDA surface so the DiskANN build lane can
# be measured against a real `Backend` (#2103). It is a *probe* feature: nothing
# in the library depends on it, and the CPU build path is byte-for-byte the same
# with it on or off. Kept separate from `cuda` because that feature means cuVS,
# which is Linux-only, while forge's CUDA backend builds on this host.
forge-gpu = ["calyx-forge/cuda"]

[dependencies]
bincode.workspace = true
blake3.workspace = true
calyx-anneal = { workspace = true }
calyx-aster = { workspace = true }
calyx-core = { workspace = true }
calyx-forge = { workspace = true }
calyx-paths = { workspace = true }
calyx-ward = { workspace = true }
memmap2.workspace = true
rand.workspace = true
rand_chacha.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
zeroize = "1"
zstd.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
cudarc = { workspace = true, optional = true, features = ["std", "driver", "nvrtc", "dynamic-linking", "cuda-13030"] }
cuvs-sys = { workspace = true, optional = true }

[[example]]
name = "diskann_build_gpu_probe_fsv"
path = "examples/diskann_build_gpu_probe_fsv.rs"
required-features = ["forge-gpu"]

[lints]
workspace = true
