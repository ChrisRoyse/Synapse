[package]
autotests = false
name = "calyx-search"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "calyx_search"
path = "src/lib.rs"

[features]
default = []
# Search rebuild policy needs to verify the actual cuVS CAGRA build path. The
# resolved truth is still `calyx_sextant::CUVS_COMPILED`; this feature only
# forwards the intended GPU build surface to sextant for explicit FSV runs.
cuda = ["calyx-sextant/cuda"]

[dependencies]
calyx-core = { workspace = true }
calyx-aster = { workspace = true }
calyx-ledger = { workspace = true }
calyx-sextant = { workspace = true }
calyx-registry = { workspace = true }
calyx-ward = { workspace = true }
serde = { workspace = true }
serde_json.workspace = true
sha2.workspace = true
rayon.workspace = true
bincode.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }

[lints]
workspace = true
