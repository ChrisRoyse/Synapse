[package]
autotests = false
name = "calyx-loom"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
cuda = ["calyx-forge/cuda"]

[dependencies]
blake3.workspace = true
calyx-aster = { workspace = true }
calyx-core = { workspace = true }
# Not optional: `agreement_scalar` routes its reduction at the shared
# runtime-dispatched CPU kernel rather than hand-rolling a fifth scalar cosine
# loop (#1917). The CUDA backend stays feature-gated behind `cuda`.
calyx-forge = { workspace = true }
calyx-ledger = { workspace = true }
calyx-ward = { workspace = true }
serde.workspace = true
serde_json.workspace = true
uuid = { workspace = true, features = ["v7"] }

[lints]
workspace = true
