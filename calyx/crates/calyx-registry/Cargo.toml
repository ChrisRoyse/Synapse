[package]
autotests = false
name = "calyx-registry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["embedding-runtimes"]
embedding-runtimes = [
    "dep:candle-core",
    "dep:candle-nn",
    "dep:candle-transformers",
    "dep:fastembed",
    "dep:hf-hub",
    "dep:memmap2",
    "dep:ort",
    "dep:tokenizers",
]
cuda = ["candle-cuda", "calyx-forge/cuda"]
candle-cuda = [
    "embedding-runtimes",
    "candle-core/cuda",
    "candle-nn/cuda",
    "candle-transformers/cuda",
    "fastembed/cuda",
]

[dependencies]
calyx-assay = { workspace = true }
calyx-aster = { workspace = true }
calyx-core = { workspace = true }
calyx-forge = { workspace = true }
calyx-ledger = { workspace = true }
blake3.workspace = true
candle-core = { version = "0.10.2", optional = true }
candle-nn = { version = "0.10.2", optional = true }
candle-transformers = { version = "0.10.2", optional = true }
fastembed = { version = "=5.16.0", default-features = false, features = ["hf-hub-rustls-tls", "ort-load-dynamic", "qwen3"], optional = true }
hf-hub = { version = "0.5.0", default-features = false, features = ["ureq", "rustls-tls"], optional = true }
memmap2 = { workspace = true, optional = true }
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "load-dynamic", "cuda", "api-24"], optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokenizers = { version = "0.22.2", default-features = false, features = ["onig"], optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
] }

[lints]
workspace = true
