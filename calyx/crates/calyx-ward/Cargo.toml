[package]
autotests = false
name = "calyx-ward"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["model-lenses"]
model-lenses = ["dep:ort", "dep:tokenizers"]

[dependencies]
calyx-aster = { workspace = true }
calyx-core = { workspace = true }
calyx-ledger = { workspace = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "load-dynamic", "api-24"], optional = true }
tokenizers = { version = "0.22.2", default-features = false, features = ["onig"], optional = true }
uuid.workspace = true

[lints]
workspace = true
