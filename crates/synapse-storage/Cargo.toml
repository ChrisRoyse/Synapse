[package]
name = "synapse-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
# PolyForm-Noncommercial-1.0.0: never publishable to crates.io. Also what
# makes this crate `private` for `cargo deny check licenses` (#1930).
publish.workspace = true

[features]
default = []

[dependencies]
calyx-aster = { workspace = true }
calyx-core = { workspace = true }
calyx-lenses = { workspace = true }
calyx-mincut = { version = "0.1.0", path = "../../calyx/crates/calyx-mincut" }
calyx-registry = { workspace = true }
fs2.workspace = true
# --- ordinary dependencies reached only from this crate's examples/ ----------
#
# These were a `[dev-dependencies]` block until #2042. Operator directive D1
# (2026-07-15) bans that section outright: a dev-only dependency surface is the
# manifest half of a test surface, and it is what let `criterion`/`proptest`/
# `tempfile` sit here before the purge. Cargo has no example-only dependency
# table, so an example's dependency IS an ordinary dependency; declaring them
# here states the real edge instead of hiding it behind a section whose whole
# meaning is "not shipped".
#
# Nothing in `src/` imports any of them, so none is linked into the daemon —
# `synapse-mcp` pulls in `synapse-storage`'s lib, and an unreferenced crate
# dependency contributes no code to that binary. Every one is already in the
# root build graph through `synapse-calyx`, so this costs no extra compilation.
#
# crc32fast          provenance_tamper_fsv rewrites an SST with correct
#                    record/body CRCs so the provenance verifier is the thing
#                    being read, not the storage layer's frame check (#1874).
crc32fast = "1"
# calyx-search       reconciled_recall_fsv drives delta reconciliation directly
#                    so an empty result is attributed to a named stage (#1907).
calyx-search = { workspace = true }
# calyx-forge        host_math_baseline_fsv times the production CPU math
# calyx-sextant      kernels so the host baseline is a measurement.
calyx-forge = { workspace = true }
calyx-sextant = { workspace = true }
# calyx-assay        ensemble_card_known_synergy_fsv reads the capability card's
#                    own pair rows back to prove no gain is a clamp (#1942).
calyx-assay = { workspace = true }
# calyx-loom         loom_agreement_kernel_fsv measures the weave cosine against
#                    the scalar loop it replaced (#1917).
calyx-loom = { workspace = true }
# tracing-subscriber the instruments that must read the engine's own structured
#                    log as evidence rather than infer it from return values
#                    (#1936). The daemon installs its own subscriber.
tracing-subscriber = { workspace = true }
# ----------------------------------------------------------------------------
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
synapse-calyx = { version = "0.1.0", path = "../synapse-calyx" }
synapse-core = { version = "0.1.0", path = "../synapse-core" }
synapse-telemetry = { version = "0.1.0", path = "../synapse-telemetry" }
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[lints]
workspace = true
