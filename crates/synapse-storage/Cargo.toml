[package]
name = "synapse-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
# PolyForm-Noncommercial-1.0.0: never publishable to crates.io. Also what
# makes this crate `private` for `cargo deny check licenses` (#1930).
publish.workspace = true

[features]
default = []

[dependencies]
calyx-aster = { workspace = true }
calyx-core = { workspace = true }
calyx-lenses = { workspace = true }
calyx-registry = { workspace = true }
fs2.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
synapse-calyx = { version = "0.1.0", path = "../synapse-calyx" }
synapse-core = { version = "0.1.0", path = "../synapse-core" }
synapse-telemetry = { version = "0.1.0", path = "../synapse-telemetry" }
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
# Used only by the provenance_tamper_fsv manual-FSV instrument, which must
# rewrite an SST with correct record/body CRCs so the storage layer accepts the
# bytes and the provenance verifier is the thing under test (issue #1874).
crc32fast = "1"
# Used only by the reconciled_recall_fsv manual-FSV instrument, which drives the
# search engine's delta-reconciliation path directly so an empty result can be
# attributed to a named stage of its own trace rather than inferred (issue #1907).
calyx-search = { workspace = true }
# Used only by host_math_baseline_fsv, which times the production CPU math
# kernels so the host's instruction baseline is chosen from a measurement.
calyx-forge = { workspace = true }
calyx-sextant = { workspace = true }
# Used only by ensemble_card_known_synergy_fsv, which reads the capability
# card's own pair rows back to prove no reported gain is a silent clamp (#1942).
calyx-assay = { workspace = true }
# Used by the FSV instruments that must read the engine's own structured log as
# evidence rather than inferring it from return values (#1936 row attribution).
tracing-subscriber = { workspace = true }
# Used only by loom_agreement_kernel_fsv, which measures the weave cosine
# against the scalar loop it replaced so the persisted-value delta is a
# measurement rather than an assertion (issue #1917).
calyx-loom = { workspace = true }

[lints]
workspace = true
