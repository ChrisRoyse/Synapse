[package]
name = "synapse-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true

[features]
default = []

[dependencies]
calyx-aster = { path = "../../calyx/crates/calyx-aster" }
calyx-core = { path = "../../calyx/crates/calyx-core" }
calyx-lenses = { path = "../../calyx/crates/calyx-lenses" }
calyx-registry = { path = "../../calyx/crates/calyx-registry" }
fs2.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
synapse-calyx = { version = "0.1.0", path = "../synapse-calyx" }
synapse-core = { version = "0.1.0", path = "../synapse-core" }
synapse-telemetry = { version = "0.1.0", path = "../synapse-telemetry" }
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
# Used only by the provenance_tamper_fsv manual-FSV instrument, which must
# rewrite an SST with correct record/body CRCs so the storage layer accepts the
# bytes and the provenance verifier is the thing under test (issue #1874).
crc32fast = "1"

[lints]
workspace = true
