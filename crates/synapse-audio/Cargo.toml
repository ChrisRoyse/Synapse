[package]
name = "synapse-audio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
# PolyForm-Noncommercial-1.0.0: never publishable to crates.io. Also what
# makes this crate `private` for `cargo deny check licenses` (#1930).
publish.workspace = true

[features]
default = []
# The STT session now *selects* an execution provider (#2109), so this crate
# declares the provider features it depends on instead of inheriting them by
# accident from whatever else the workspace build happens to link.
cuda = ["synapse-models/cuda"]

[dependencies]
# calyx-forge (no `cuda` feature: this crate needs the host GPU reservation
# ledger, not the kernels) is how a GPU-backed STT session registers its
# device envelope with the same OS-wide Source of Truth every other GPU
# consumer uses (#2109).
calyx-forge = { workspace = true }
chrono.workspace = true
metrics.workspace = true
ort.workspace = true
serde.workspace = true
serde_json.workspace = true
synapse-core = { version = "0.1.0", path = "../synapse-core" }
synapse-models = { version = "0.1.0", path = "../synapse-models" }
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
wasapi.workspace = true
windows.workspace = true

[lints.rust]
unsafe_code = "allow"
unused = { level = "warn", priority = -1 }

[lints.clippy]
all = "deny"
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
