[package]
name = "synapse-calyx"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
# PolyForm-Noncommercial-1.0.0: never publishable to crates.io. Also what
# makes this crate `private` for `cargo deny check licenses` (#1930).
publish.workspace = true

[features]
# CUDA kernel compilation is NOT a default. `calyx-forge`'s build script shells
# out to `nvcc` from a CUDA 13.3 toolkit, so making it default made every
# `cargo build -p synapse-mcp` physically impossible on any host without that
# toolkit installed -- including hosts with no NVIDIA device at all, where the
# compiled kernels could never run. Acceleration is a host capability, so it is
# selected at build time by evidence (scripts/synapse-setup.ps1 detects the
# NVIDIA driver plus nvcc and passes `--features calyx-cuda`).
#
# This is not a silent CPU fallback: a build without this feature still refuses
# `math_backend="cuda"`, and `math_backend="auto"` only resolves to CPU after
# NVML proves this host has no CUDA device (see src/math.rs).
default = []
calyx-cuda = ["calyx-assay/cuda", "calyx-forge/cuda"]

[dependencies]
arc-swap.workspace = true
base64.workspace = true
calyx-assay = { workspace = true }
calyx-anneal = { workspace = true }
calyx-aster = { workspace = true }
calyx-core = { workspace = true }
calyx-forge = { workspace = true }
calyx-ledger = { workspace = true }
calyx-lodestar = { workspace = true }
calyx-loom = { workspace = true }
calyx-oracle = { workspace = true }
calyx-paths = { workspace = true }
calyx-registry = { workspace = true }
calyx-search = { workspace = true }
calyx-sextant = { workspace = true }
# The Ward guard (#1677). Until now no synapse-* crate depended on it, so the
# Guard CF was never written and every profile-backed guarded search failed
# closed with CALYX_GUARD_PROVISIONAL against an empty CF. src/ward.rs is the
# writer that gives the already-wired calyx-search consumer something to load.
calyx-ward = { workspace = true }
fs2.workspace = true
num-traits.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
ulid.workspace = true
uuid.workspace = true
windows-sys.workspace = true

[lints]
workspace = true
