[package]
name = "synapse-calyx"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true

[features]
# CUDA kernel compilation is NOT a default. `calyx-forge`'s build script shells
# out to `nvcc` from a CUDA 13.3 toolkit, so making it default made every
# `cargo build -p synapse-mcp` physically impossible on any host without that
# toolkit installed -- including hosts with no NVIDIA device at all, where the
# compiled kernels could never run. Acceleration is a host capability, so it is
# selected at build time by evidence (scripts/synapse-setup.ps1 detects the
# NVIDIA driver plus nvcc and passes `--features calyx-cuda`).
#
# This is not a silent CPU fallback: a build without this feature still refuses
# `math_backend="cuda"`, and `math_backend="auto"` only resolves to CPU after
# NVML proves this host has no CUDA device (see src/math.rs).
default = []
calyx-cuda = ["calyx-forge/cuda"]

[dependencies]
arc-swap.workspace = true
base64.workspace = true
calyx-assay = { path = "../../calyx/crates/calyx-assay" }
calyx-aster = { path = "../../calyx/crates/calyx-aster" }
calyx-core = { path = "../../calyx/crates/calyx-core" }
calyx-forge = { path = "../../calyx/crates/calyx-forge" }
calyx-ledger = { path = "../../calyx/crates/calyx-ledger" }
calyx-lodestar = { path = "../../calyx/crates/calyx-lodestar" }
calyx-loom = { path = "../../calyx/crates/calyx-loom" }
calyx-paths = { path = "../../calyx/crates/calyx-paths" }
calyx-registry = { path = "../../calyx/crates/calyx-registry" }
calyx-search = { path = "../../calyx/crates/calyx-search" }
calyx-sextant = { path = "../../calyx/crates/calyx-sextant" }
fs2.workspace = true
num-traits.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
