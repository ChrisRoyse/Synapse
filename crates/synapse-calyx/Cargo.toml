[package]
name = "synapse-calyx"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
# PolyForm-Noncommercial-1.0.0: never publishable to crates.io. Also what
# makes this crate `private` for `cargo deny check licenses` (#1930).
publish.workspace = true

[features]
# CUDA kernel compilation is NOT a default. `calyx-forge`'s build script shells
# out to `nvcc` from a CUDA 13.3 toolkit, so making it default made builds fail
# on hosts without that toolkit. `calyx-cuda` remains only for explicitly
# requested standalone Calyx dependency compile/probe work. The installed
# `synapse-mcp` graph has no forwarding feature, `scripts/synapse-setup.ps1`
# never configures NVCC or enables it, and setup rejects accelerator requests.
# The installed runtime config is bindingly `math_backend="cpu"` with
# `vram_budget_bytes=0`; it does not select or fall back from CUDA at runtime.
default = []
calyx-cuda = ["calyx-assay/cuda", "calyx-forge/cuda", "calyx-search/cuda-pq"]

[dependencies]
arc-swap.workspace = true
base64.workspace = true
bincode.workspace = true
calyx-assay = { workspace = true }
calyx-anneal = { workspace = true }
calyx-aster = { workspace = true }
calyx-core = { workspace = true }
calyx-forge = { workspace = true }
calyx-ledger = { workspace = true }
calyx-lodestar = { workspace = true }
calyx-loom = { workspace = true }
calyx-oracle = { workspace = true }
calyx-paths = { workspace = true }
calyx-registry = { workspace = true }
calyx-search = { workspace = true }
calyx-sextant = { workspace = true }
# The Ward guard (#1677). Until now no synapse-* crate depended on it, so the
# Guard CF was never written and every profile-backed guarded search failed
# closed with CALYX_GUARD_PROVISIONAL against an empty CF. src/ward.rs is the
# writer that gives the already-wired calyx-search consumer something to load.
calyx-ward = { workspace = true }
fs2.workspace = true
num-traits.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
ulid.workspace = true
uuid.workspace = true
windows-sys.workspace = true

[lints]
workspace = true
